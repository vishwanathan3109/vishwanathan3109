name: Metrics

on:
  schedule:
    - cron: "30 18 * * *"   # daily, 18:30 UTC = midnight IST
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Profile overview card
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vishwanathan3109
          filename: metrics.overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          base_hireable: yes
          config_timezone: Asia/Kolkata

      # 2) Terminal-style intro and coding habits
      - name: Terminal card
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vishwanathan3109
          filename: metrics.terminal.svg
          template: terminal
          base: ""
          plugin_introduction: yes
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          config_timezone: Asia/Kolkata

      # 3) Isometric contribution calendar
      - name: Isometric calendar
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vishwanathan3109
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata

      # 4) Languages
      - name: Languages
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vishwanathan3109
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata

      # 5) Activity charts (when you code)
      - name: Habits charts
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vishwanathan3109
          filename: metrics.habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_from: 200
          plugin_habits_facts: no
          plugin_habits_charts: yes
          config_timezone: Asia/Kolkata

      # 6) Achievements
      - name: Achievements
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vishwanathan3109
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 12
          config_timezone: Asia/Kolkata

      # 7) Pinned repositories
      - name: Pinned repositories
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vishwanathan3109
          filename: metrics.pinned.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          config_timezone: Asia/Kolkata
